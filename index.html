<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1128" />
  <title>Bosnia - World Cup 2026 Web3 Sticker Album</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Bosnia & Herzegovina World Cup 2026 Web3 Sticker Album",
    "description": "Collect, trade, and paste digital stickers of the Bosnia & Herzegovina national football team's 2026 World Cup squad. Built on Solana.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web",
    "inLanguage": ["bs", "en"]
  }
  </script>
  <script>
    (function () {
      try {
        var originalFetch = window.fetch;
        var fetchValue = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return fetchValue;
          },
          set: function (val) {
            fetchValue = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Failed to patch window.fetch:", e);
      }
    })();
  </script>
</head>

<body class="album-container min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
